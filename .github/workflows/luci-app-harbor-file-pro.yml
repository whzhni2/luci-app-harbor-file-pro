name: Build luci-app-harbor-file-pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [openwrt-24.10, openwrt-25.12]
    steps:
      - uses: actions/checkout@v4
      - name: Build luci-app-harbor-file-pro
        uses: openwrt/gh-action-sdk@v11
        env:
          ARCH: x86_64-${{ matrix.sdk }}
          PACKAGES: luci-app-harbor-file-pro
          FEEDNAME: packages_ci
          NO_REFRESH_CHECK: true

      - uses: actions/upload-artifact@v4
        with:
          name: ipk-${{ matrix.sdk }}
          path: |
            bin/packages/*/packages/luci-app-harbor-file-pro*.ipk
            bin/packages/*/*/luci-app-harbor-file-pro*.ipk

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - id: ver
        run: echo "tag=v$(awk -F':=' '/^PKG_VERSION:=/{print $2}' luci-app-harbor-file-pro/Makefile)" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          path: ipks
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: luci-app-harbor-file-pro ${{ steps.ver.outputs.tag }}
          files: ipks/*
          make_latest: true
